<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Calculator</h1>
  <div class="calculator">
    <!-- Calculator content will go here -->
     <div class="display"><input type="text" readonly></div>
     
     <div>
      <button id="btn-on">x</button>
      <button id="btn-off">OFF</button>
      <button id="btnsquareroot">√</button>
      <button id="btnpernentage">%</button>
     </div>

     <div>
      <button id="btnmrc">MRC</button>
      <button id="btnm">M-</button>
      <button id="btnmm">M+</button>
      <button id="btndivison">/</button>
    </div>

    <div>
      <button id="bnt7">7</button>
      <button id="btn8">8</button>
      <button id="btn9">9</button>
      <button id="btnmultiple">*</button>
    </div>

    <div>
      <button id="btn4">4</button>
      <button id="btn5">5</button>
      <button id="btn6">6</button>
      <button id="btnminus">-</button>
    </div>

    <div id="btn4">
      <button id="btn1">1</button>
      <button id="btn2">2</button>
      <button id="btn3">3</button>
      <button id="btnplus">+</button>
    </div>

      <div>
        <button id="btn0">0</button>
        <button id="btnpoint">.</button>
        <button id="btnequal">=</button>
      </div>

  </div>
  <script src="Javascript.js"></script>
</body>
</html>
